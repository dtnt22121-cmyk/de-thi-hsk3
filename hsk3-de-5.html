<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đề thi HSK 3 - Đề 5</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #f4f4f9; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background-color: #45a049; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .loading { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
  </style>
</head>
<body>

<div class="container">
  <h1>BÀI THI HSK 3 - ĐỀ 5</h1>
  
  <form id="hskForm">
    <div class="form-group">
      <label for="studentName">Họ và tên học sinh:</label>
      <input type="text" id="studentName" required placeholder="Ví dụ: Nguyễn Văn A...">
    </div>
    
    <div class="form-group">
      <label for="studentScore">Điểm số:</label>
      <input type="text" id="studentScore" required placeholder="Ví dụ: 250/300...">
    </div>

    <button type="submit" id="submitBtn">Nộp bài</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // Link Apps Script của cô
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8OpLpq0Gga8vtBHdYzyHDRCq1etl2IroXXNw293_0VUfl9BDIIKGiClWCLyvoqV7UEg/exec';

  document.getElementById('hskForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const name = document.getElementById('studentName').value;
    const score = document.getElementById('studentScore').value;

    // Đổi trạng thái đang tải
    btn.disabled = true;
    btn.innerText = 'Đang gửi điểm...';
    status.style.display = 'block';
    status.className = 'status loading';
    status.innerText = 'Đang kết nối với bảng điểm...';

    // Tạo dữ liệu gửi đi
    const formData = new FormData();
    formData.append('name', name);
    formData.append('score', score);
    formData.append('exam', 'HSK 3 - Đề 5');

    // Gửi dữ liệu bằng POST với chế độ no-cors an toàn
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: formData
    })
    .then(() => {
      // Vì no-cors không trả về response đọc được, cứ coi như fetch thành công là ok
      status.className = 'status success';
      status.innerText = '🎉 Nộp bài thành công! Điểm đã được lưu.';
      document.getElementById('hskForm').reset();
      btn.innerText = 'Nộp bài';
      btn.disabled = false;
    })
    .catch(error => {
      status.className = 'status error';
      status.innerText = '⚠️ Lỗi kết nối mạng! Vui lòng thử lại.';
      btn.innerText = 'Thử lại';
      btn.disabled = false;
      console.error('Lỗi:', error);
    });
  });
</script>

</body>
</html>
