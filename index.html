<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>准考证 · Ôn tập tổng hợp HSK3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#173B3A; --teal:#1F7A6C; --teal-2:#2A9D8F; --paper:#FBF7ED; --paper-line:#E4DCC8;
    --seal:#C0392B; --seal-dark:#8E2A1E; --gold:#D4A017; --green:#3E8E5A;
    --shadow:0 10px 28px rgba(23,59,58,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;
    background:radial-gradient(circle at 15% 8%, rgba(212,160,23,0.10), transparent 40%),
               radial-gradient(circle at 90% 85%, rgba(31,122,108,0.12), transparent 45%), var(--paper);
    font-family:'Nunito',sans-serif; color:var(--ink); padding-bottom:28px;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;}
  .zh-word{font-family:'Noto Sans SC',sans-serif; font-weight:700;}
  .stamp-text{font-family:'Ma Shan Zheng',cursive;}
  .pinyin-mini{display:block;font-size:11.5px;color:#8a9695;font-weight:600;margin-top:1px;font-family:'Nunito';}
  .pinyin-line{font-size:13px;color:#7a8a89;text-align:center;margin-bottom:8px;font-style:italic;}

  .ticket{margin:16px 14px 10px; padding:16px 18px;
    background:linear-gradient(135deg,var(--teal),var(--teal-2)); border-radius:16px; color:#fff;
    box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .ticket::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border-radius:50%;background:rgba(255,255,255,0.08);}
  .ticket .kicker{font-size:12px;letter-spacing:2px;opacity:.85;text-transform:uppercase;}
  .ticket h1{margin:2px 0 0;font-size:20px;}
  .ticket .sub{font-size:13px;opacity:.9;margin-top:4px;}

  .screen{display:none;padding:0 14px;}
  .screen.active{display:block;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);
    border:1px solid var(--paper-line);margin-bottom:14px;}

  .path-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;
    border:2px solid var(--paper-line);background:#fffdf7;cursor:pointer;width:100%;text-align:left;
    margin-bottom:12px;}
  .path-btn .ic{font-size:30px;}
  .path-btn .tt{font-family:'Baloo 2';font-size:16px;color:var(--ink);}
  .path-btn .dd{font-size:12.5px;color:#7a8a89;margin-top:2px;}
  .path-btn.teal{border-color:var(--teal-2);}

  .student-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .student-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;
    border-radius:14px;border:2px solid var(--paper-line);background:#fffdf7;cursor:pointer;
    font-family:'Baloo 2';font-size:16px;color:var(--ink);}
  .student-btn .avatar{font-size:32px;}
  .teacher-link{margin-top:4px;text-align:center;font-size:13px;color:var(--teal);
    text-decoration:underline;cursor:pointer;}
  .back-link{font-size:13px;color:var(--teal);text-decoration:underline;cursor:pointer;
    display:inline-block;margin-bottom:10px;}

  .tabbar{display:flex;overflow-x:auto;gap:6px;padding:10px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;}
  .tab{flex:0 0 auto;padding:8px 12px;border-radius:20px;border:2px solid var(--paper-line);
    background:#fffdf7;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .tab.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .tab.done::after{content:'✓';color:var(--green);font-weight:900;}
  .tab.active.done::after{color:#d7ffe6;}

  .sec-title{font-size:17px;margin:2px 0 4px;}
  .sec-sub{font-size:13px;color:#6d7c7b;margin-bottom:12px;}
  .item-count{font-size:12px;color:#8a9695;font-weight:700;margin-bottom:8px;}

  .q-block{border-bottom:1px solid var(--paper-line);padding:14px 0;}
  .q-block:last-child{border-bottom:none;}
  .q-num{display:inline-block;font-size:11px;font-weight:800;color:var(--teal);
    background:rgba(31,122,108,.1);padding:2px 9px;border-radius:10px;margin-bottom:8px;}
  .q-display-emoji{font-size:48px;text-align:center;margin:4px 0 10px;}
  .q-display-hanzi{font-size:24px;text-align:center;margin:4px 0 2px;}
  .speak-btn{border:none;background:var(--teal);color:#fff;width:32px;height:32px;border-radius:50%;
    font-size:14px;cursor:pointer;margin-left:6px;}
  .speak-btn.big{width:56px;height:56px;font-size:22px;display:block;margin:6px auto 4px;}
  .q-prompt{font-size:15px;font-weight:700;margin-bottom:10px;text-align:center;}
  .q-prompt.left{text-align:left;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .opt-btn{text-align:left;padding:9px 11px;border-radius:11px;border:2px solid var(--paper-line);
    background:#fffdf7;font-size:14px;cursor:pointer;color:var(--ink);font-family:'Nunito';}
  .opt-btn.selected{border-color:var(--gold);background:#FFF6DF;}
  .opt-btn.correct{border-color:var(--green);background:#E9F7EE;}
  .opt-btn.wrong{border-color:var(--seal);background:#FBEAE8;}
  .fb-note{font-size:12.5px;margin-top:6px;color:var(--seal);}
  .fb-note.ok{color:var(--green);}
  .reveal-box{margin-top:8px;font-size:13px;background:#F7F1E1;border-radius:8px;padding:8px 10px;}

  .dialog-box{background:#F7F1E1;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px;}
  .dialog-a{color:var(--teal);font-weight:800;}

  .para-box{font-size:16px;line-height:2.1;background:#FFFDF7;border:1px solid var(--paper-line);
    border-radius:12px;padding:14px;margin-bottom:6px;}
  .blank-slot{display:inline-block;min-width:44px;padding:2px 8px;border-bottom:2px solid var(--teal);
    text-align:center;font-family:'Noto Sans SC';font-weight:700;color:var(--teal);cursor:pointer;}
  .blank-slot.empty{color:#c7bfa8;}
  .wordbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .wb-chip{padding:7px 12px;border-radius:10px;background:#fffdf7;border:2px solid var(--paper-line);
    font-family:'Noto Sans SC';font-size:14px;cursor:pointer;text-align:center;line-height:1.3;}
  .wb-chip.used{opacity:.3;pointer-events:none;}

  .passage{background:#FFFDF7;border:1px solid var(--paper-line);border-radius:12px;padding:14px;
    font-size:16px;line-height:1.9;margin-bottom:4px;font-family:'Noto Sans SC';}
  .toggle-link{font-size:12.5px;color:var(--teal);text-decoration:underline;cursor:pointer;
    display:inline-block;margin-bottom:12px;}

  .match-cols{display:flex;gap:10px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
  .match-item{padding:9px 8px;border-radius:10px;border:2px solid var(--paper-line);background:#fffdf7;
    font-size:13.5px;text-align:center;cursor:pointer;}
  .match-item.zh{font-family:'Noto Sans SC';font-weight:700;font-size:16px;}
  .match-item.sel{border-color:var(--gold);background:#FFF6DF;}
  .match-item.matched{border-color:var(--green);background:#E9F7EE;pointer-events:none;opacity:.7;}
  .match-item.wrong{border-color:var(--seal);background:#FBEAE8;}

  .btn{padding:13px;border-radius:12px;border:none;font-family:'Baloo 2';font-size:15px;cursor:pointer;}
  .btn-primary{background:var(--teal);color:#fff;width:100%;margin-top:6px;}
  .btn-ghost{background:#fff;color:var(--teal);border:2px solid var(--teal);width:100%;margin-top:8px;}

  .result-wrap{text-align:center;}
  .stamp{width:150px;height:150px;margin:10px auto 6px;border-radius:50%;border:6px solid var(--seal);
    color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);}
  .stamp .big{font-size:30px;font-weight:900;font-family:'Baloo 2';}
  .stamp .zh-stamp{font-family:'Ma Shan Zheng';font-size:18px;margin-top:2px;}
  .sec-summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--paper-line);font-size:14px;}
  .sec-summary-row b{color:var(--teal);}

  .teach-row{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
    border:1px solid var(--paper-line);}
  .teach-top{display:flex;justify-content:space-between;align-items:center;}
  .teach-name{font-family:'Baloo 2';font-size:16px;}
  .teach-meta{font-size:12px;color:#7a8a89;}
  .teach-score{font-family:'Baloo 2';font-size:20px;color:var(--teal);}
  .teach-detail{font-size:12px;color:#7a8a89;margin-top:6px;}
  .empty{text-align:center;color:#8a9695;padding:30px 10px;font-size:14px;}

  .study-tabbar{display:flex;gap:8px;margin-bottom:14px;}
  .study-tab{flex:1;padding:10px;border-radius:12px;border:2px solid var(--paper-line);background:#fffdf7;
    font-family:'Baloo 2';font-size:14px;text-align:center;cursor:pointer;color:var(--ink);}
  .study-tab.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .gram-card{border:1px solid var(--paper-line);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:#fffdf7;}
  .gram-num{font-size:11px;font-weight:800;color:#fff;background:var(--teal);display:inline-block;
    padding:2px 8px;border-radius:10px;margin-bottom:6px;}
  .gram-struct{font-family:'Baloo 2';font-size:15px;margin-bottom:4px;}
  .gram-usage{font-size:13px;color:var(--ink);background:#F7F1E1;border-radius:8px;padding:7px 9px;margin:6px 0;line-height:1.5;}
  .gram-usage b{color:var(--teal);}
  .gram-example{font-family:'Noto Sans SC';font-size:16px;font-weight:700;margin-top:6px;}
  .gram-pinyin{font-size:12.5px;color:#7a8a89;font-style:italic;}
  .gram-meaning{font-size:13.5px;color:var(--ink);margin-top:2px;}

  .lesson-accordion{border:1px solid var(--paper-line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  .lesson-head{padding:12px 14px;background:#fffdf7;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;font-family:'Baloo 2';font-size:14.5px;}
  .lesson-head .arrow{transition:transform .2s;font-size:12px;color:var(--teal);}
  .lesson-head.open .arrow{transform:rotate(90deg);}
  .lesson-body{display:none;padding:6px 14px 12px;}
  .lesson-body.open{display:block;}
  .vocab-card{padding:9px 0;border-bottom:1px solid var(--paper-line);}
  .vocab-card:last-child{border-bottom:none;}
  .vocab-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .vocab-zh{font-family:'Noto Sans SC';font-weight:700;font-size:16.5px;}
  .vocab-py{font-size:12px;color:#8a9695;font-style:italic;}
  .vocab-vi{font-size:13px;color:var(--ink);margin-left:auto;text-align:right;}
  .vocab-example{font-size:12.5px;color:#5f716f;background:#F7F1E1;border-radius:7px;padding:6px 8px;margin-top:5px;}
  .vocab-example .ex-zh{font-family:'Noto Sans SC';font-weight:600;color:var(--ink);}
  .vocab-example .ex-py{font-style:italic;}
</style>
</head>
<body>

<div class="ticket">
  <div class="kicker">准考证 · Phiếu ôn tập</div>
  <h1>HSK3 2.0 · Ôn tập tổng hợp 20 bài</h1>
  <div class="sub" id="ticketSub">Chọn một mục để bắt đầu</div>
</div>

<div class="screen active" id="screen-home">
  <div class="card">
    <button class="path-btn teal" id="goStudy">
      <span class="ic">📘</span>
      <span><span class="tt">Ôn tập kiến thức</span><br><span class="dd">Xem lại từ vựng &amp; ngữ pháp trước khi làm bài — cô dạy hoặc học sinh tự xem ở nhà</span></span>
    </button>
    <button class="path-btn" id="goExercise">
      <span class="ic">📝</span>
      <span><span class="tt">Làm bài tập</span><br><span class="dd">Chọn tên rồi làm 8 dạng bài tự chấm điểm</span></span>
    </button>
  </div>
</div>

<script>
  console.log("HSK3 App Loaded");
</script>
</body>
</html>
