<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>准考证 · Ôn tập tổng hợp HSK3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#173B3A; --teal:#1F7A6C; --teal-2:#2A9D8F; --paper:#FBF7ED; --paper-line:#E4DCC8;
    --seal:#C0392B; --seal-dark:#8E2A1E; --gold:#D4A017; --green:#3E8E5A;
    --shadow:0 10px 28px rgba(23,59,58,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;
    background:radial-gradient(circle at 15% 8%, rgba(212,160,23,0.10), transparent 40%),
               radial-gradient(circle at 90% 85%, rgba(31,122,108,0.12), transparent 45%), var(--paper);
    font-family:'Nunito',sans-serif; color:var(--ink); padding-bottom:28px;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;}
  .zh-word{font-family:'Noto Sans SC',sans-serif; font-weight:700;}
  .stamp-text{font-family:'Ma Shan Zheng',cursive;}

  .ticket{margin:16px 14px 10px; padding:16px 18px;
    background:linear-gradient(135deg,var(--teal),var(--teal-2)); border-radius:16px; color:#fff;
    box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .ticket::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border-radius:50%;background:rgba(255,255,255,0.08);}
  .ticket .kicker{font-size:12px;letter-spacing:2px;opacity:.85;text-transform:uppercase;}
  .ticket h1{margin:2px 0 0;font-size:20px;}
  .ticket .sub{font-size:13px;opacity:.9;margin-top:4px;}

  .screen{display:none;padding:0 14px;}
  .screen.active{display:block;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);
    border:1px solid var(--paper-line);margin-bottom:14px;}

  .path-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;
    border:2px solid var(--paper-line);background:#fffdf7;cursor:pointer;width:100%;text-align:left;
    margin-bottom:12px;}
  .path-btn .ic{font-size:30px;}
  .path-btn .tt{font-family:'Baloo 2';font-size:16px;color:var(--ink);font-weight:700;}
  .path-btn .dd{font-size:12.5px;color:#7a8a89;margin-top:2px;}
  .path-btn.teal{border-color:var(--teal-2);}
  .path-btn.exam-btn-5{border-color:var(--seal);background:#fff9f8;}

  .student-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .teacher-link{margin-top:4px;text-align:center;font-size:13px;color:var(--teal);
    text-decoration:underline;cursor:pointer;}
  .back-link{font-size:13px;color:var(--teal);text-decoration:underline;cursor:pointer;
    display:inline-block;margin-bottom:10px;}

  .exam-head{background:linear-gradient(135deg,#8e2a1e,#c0392b);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px;}
  .exam-head h3{margin:0 0 4px;}
  .exam-meta{font-size:12.5px;opacity:.92;line-height:1.6;}
  .btn{padding:13px;border-radius:12px;border:none;font-family:'Baloo 2';font-size:15px;cursor:pointer;width:100%;}
  .btn-ghost{background:#fff;color:var(--teal);border:2px solid var(--teal);margin-top:8px;}
</style>
</head>
<body>

<div class="ticket">
  <div class="kicker">准考证 · Phiếu ôn tập</div>
  <h1>HSK3 2.0 · HỆ THỐNG ĐỀ THI VÀ ÔN TẬP</h1>
  <div class="sub" id="ticketSub">Vui lòng chọn Đề số 1 hoặc Đề số 5 để làm bài</div>
</div>

<div class="screen active" id="screen-home">
  <div class="card">
    <button class="path-btn teal" onclick="alert('Đang mở phần ôn tập kiến thức...')">
      <span class="ic">📘</span>
      <span><span class="tt">Ôn tập kiến thức</span><br><span class="dd">Xem lại từ vựng &amp; ngữ pháp trước khi làm bài</span></span>
    </button>
    
    <button class="path-btn" onclick="alert('Đang mở bài tập tự luyện...')">
      <span class="ic">📝</span>
      <span><span class="tt">Làm bài tập tự luyện</span><br><span class="dd">Các dạng bài luyện tập theo chuyên đề</span></span>
    </button>

    <!-- TÁCH BÀI THI THÀNH 2 ĐỀ RIÊNG BIỆT DỄ NHÌN -->
    <div style="margin-top: 15px; border-top: 2px dashed var(--paper-line); padding-top: 15px;">
      <p style="font-weight: 700; margin-bottom: 10px; font-size: 15px;">🎯 DANH SÁCH ĐỀ THI HSK3:</p>

      <button class="path-btn teal" onclick="openExam(1)">
        <span class="ic">🎓</span>
        <span>
          <span class="tt" style="color: var(--teal);">Đề thi HSK3 — ĐỀ SỐ 1</span><br>
          <span class="dd">Mã đề: H31001 · Dành riêng cho học sinh làm độc lập (Thư, Bông, Bo, Sumo)</span>
        </span>
      </button>

      <button class="path-btn exam-btn-5" onclick="openExam(5)">
        <span class="ic">📕</span>
        <span>
          <span class="tt" style="color: var(--seal);">Đề thi HSK3 — ĐỀ SỐ 5</span><br>
          <span class="dd">Mã đề: H31005 · Cập nhật theo cấu trúc giao diện mới trên web</span>
        </span>
      </button>
    </div>
  </div>

  <div class="teacher-link">👩‍🏫 Xem bảng kết quả của cô giáo</div>
</div>

<!-- MÀN HÌNH LÀM BÀI THI -->
<div class="screen" id="screen-exam">
  <div class="card">
    <span class="back-link" onclick="goHome()">← Quay lại chọn đề</span>
    <div class="exam-head" id="examHeadInfo">
      <!-- Nội dung đề thi sẽ hiển thị ở đây -->
    </div>
    <div id="examBody" style="padding: 10px 0;">
      <p style="text-align: center; color: #666;">Đang tải nội dung câu hỏi...</p>
    </div>
  </div>
</div>

<script>
  function openExam(examNum) {
    document.getElementById('screen-home').classList.remove('active');
    document.getElementById('screen-exam').classList.add('active');
    
    const headInfo = document.getElementById('examHeadInfo');
    const examBody = document.getElementById('examBody');

    if(examNum === 1) {
      headInfo.style.background = "linear-gradient(135deg, #1F7A6C, #2A9D8F)";
      headInfo.innerHTML = `<h3>新汉语水平考试 · HSK（三级）</h3><div class="exam-meta"><b>MÃ ĐỀ: H31001 — ĐỀ SỐ 1</b><br>Đề thi ôn tập tổng hợp 20 bài. Chọn tên học sinh và bắt đầu làm bài.</div>`;
      examBody.innerHTML = `<p><b>Giao diện bài thi Đề Số 1:</b> Hệ thống đã sẵn sàng cho học sinh làm bài.</p><button class="btn btn-ghost" onclick="goHome()">Quay lại</button>`;
    } else if(examNum === 5) {
      headInfo.style.background = "linear-gradient(135deg, #8e2a1e, #c0392b)";
      headInfo.innerHTML = `<h3>新汉语水平考试 · HSK（三级）</h3><div class="exam-meta"><b>MÃ ĐỀ: H31005 — ĐỀ SỐ 5</b><br>Đề thi trực tuyến theo dữ liệu mới nhất trên trang web.</div>`;
      examBody.innerHTML = `<p><b>Giao diện bài thi Đề Số 5:</b> Hệ thống đã đồng bộ hóa đề thi số 5 từ trang web.</p><button class="btn btn-ghost" onclick="goHome()">Quay lại</button>`;
    }
  }

  function goHome() {
    document.getElementById('screen-exam').classList.remove('active');
    document.getElementById('screen-home').classList.add('active');
  }
</script>

</body>
</html>
